working_dir: "${SLIME_PATH}"
excludes:
  - "**/.git/"
  - "**/.git.backup/"
  - "sgl-kernel"
  - "/.git.disabled*"
  - "*.tar.gz"
  - "extra_data"
  - ".json"
  - "checkpoints"
  - "output"
  - "outputs"
  - "*.log"
  - ".log"
  - "*.safetensors"
  - "musa_examples"
  - "**/logs/**"
  - "**/traces/**"
  - "**/sglang-traces/**"
  - "**/tensorboard/**"
  - "**/mems/**"
  - "/doc/"
  - "**/test/**"
  - "**/tests/**"
  - "**/benchmark/**"
  - "**/examples/**"
  - "**/docs/**"
  - "**/docker/**"
  - "**/dist/**"
  - "**/*.egg-info/**"
  - "**/__pycache__/**"
env_vars:
  # Paths and imports. The launcher expands these placeholders before submit.
  MUSA_TITAN_PATH: "${MUSA_TITAN_PATH}"
  MEGATRON_PATH: "${MEGATRON_PATH}"
  SLIME_PATH: "${SLIME_PATH}"
  PYTHONPATH: "${RUNTIME_PYTHONPATH}"
  LD_LIBRARY_PATH: "${RUNTIME_LD_LIBRARY_PATH}"

  # Device and MUSA runtime
  SLIME_ACCELERATOR: "musa"
  ACCELERATOR_BACKEND: "musa"
  MUSA_VISIBLE_DEVICES: "${MUSA_VISIBLE_DEVICES}"
  MUSA_LAUNCH_BLOCKING: "0"
  MUSA_EXECUTION_TIMEOUT: "3000000"
  MUSA_BLOCK_SCHEDULE_MODE: "1"
  MUSA_BLOCK_DISTRIBUTION_GRANULARITY: "0"
  CUDA_DEVICE_MAX_CONNECTIONS: "1"

  # MCCL and collective communication
  MCCL_LIB: "${MCCL_LIB}"
  MCCL_TIMEOUT: "600000"
  MCCL_CHECK_POINTERS: "0"
  MCCL_PROTOS: "2"
  MCCL_ALGOS: "1"
  MCCL_IB_GID_INDEX: "3"
  MCCL_BUFFSIZE: "20971520"
  MCCL_MAX_NCHANNELS: "14"
  GLOO_SOCKET_IFNAME: "${GLOO_SOCKET_IFNAME}"
  UPDATE_MODE: "p2p-broadcast"
  FORCE_ON_POLICY: "1"

  # Framework and application settings
  TOKENIZERS_PARALLELISM: "false"
  VLLM_USE_V1: "0"
  ACCELERATE_USE_FSDP: "1"
  FSDP_CPU_RAM_EFFICIENT_LOADING: "1"
  MATE_FORCE_JIT: "1"

  # Ray and integration settings
  RAY_DEDUP_LOGS: "1"
  RAY_OVERRIDE_JOB_RUNTIME_ENV: "1"
  RAY_EXPERIMENTAL_NOSET_MUSA_VISIBLE_DEVICES: "1"
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"
  TORCHINDUCTOR_COMPILE_THREADS: "1"
  SLIME_MUSA_PATCH_AT_STARTUP: "1"
  SLIME_ENABLE_EXPANDABLE_SEGMENTS: "1"
  SGLANG_MUSA_USE_JIT_ALL_REDUCE: "0"
